<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản - FreshDrink</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-gray-100">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-yellow-300 to-yellow-500 text-emerald-950 rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg">
        🥤
      </div>
      <h1 class="text-2xl font-black text-gray-900 uppercase">Tạo Tài Khoản</h1>
      <p class="text-xs text-gray-400 mt-1">Đăng ký thành viên FreshDrink để nhận nhiều ưu đãi</p>
    </div>

    <form onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Họ và tên</label>
        <input type="text" id="reg-name" required placeholder="Nhập họ và tên của bạn" class="w-full border border-gray-200 p-3 rounded-xl text-xs outline-none focus:border-emerald-700">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Email / Tài khoản</label>
        <input type="email" id="reg-email" required placeholder="Nhập email của bạn" class="w-full border border-gray-200 p-3 rounded-xl text-xs outline-none focus:border-emerald-700">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Mật khẩu</label>
        <input type="password" id="reg-password" required placeholder="Nhập mật khẩu" class="w-full border border-gray-200 p-3 rounded-xl text-xs outline-none focus:border-emerald-700">
      </div>
      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-black text-xs py-3.5 rounded-xl shadow-lg transition uppercase tracking-wider mt-2">
        Đăng Ký Ngay
      </button>
    </form>

    <p class="text-center text-xs text-gray-500 mt-6">
      Đã có tài khoản? <a href="login.html" class="text-emerald-700 font-bold hover:underline">Đăng nhập tại đây</a>
    </p>
  </div>

  <script>
    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      let users = JSON.parse(localStorage.getItem('users')) || [];

      // Kiểm tra xem email đã tồn tại hay chưa
      const existingUser = users.find(u => u.email === email);
      if (existingUser) {
        alert('Email này đã được đăng ký tài khoản trước đó! Vui lòng chọn email khác hoặc đăng nhập.');
        return;
      }

      // Lưu tài khoản mới
      users.push({ name, email, password });
      localStorage.setItem('users', JSON.stringify(users));

      alert('Đăng ký tài khoản thành công! Vui lòng đăng nhập.');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>

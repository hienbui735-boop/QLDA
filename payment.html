<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Toán - FreshDrink</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-gray-800 font-sans">

  <!-- HEADER -->
  <header class="bg-emerald-950 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-yellow-300 to-yellow-500 text-emerald-950 rounded-full flex items-center justify-center font-black shadow">🥤</div>
        <span class="text-xl font-black tracking-widest text-yellow-400">FRESHDRINK</span>
      </a>
      <a href="cart.html" class="text-xs font-bold text-yellow-300 hover:underline">← Quay lại giỏ hàng</a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-black text-stone-900 uppercase mb-8 text-center">Xác Nhận & Thanh Toán Đơn Hàng</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <!-- CỘT 1: THÔNG TIN GIAO HÀNG & PHƯƠNG THỨC -->
      <div class="bg-white rounded-3xl p-8 shadow-sm border border-stone-200 space-y-6">
        <h2 class="text-lg font-black uppercase text-stone-900 border-b pb-3">📍 Thông Tin Nhận Hàng</h2>
        
        <div class="space-y-4 text-xs">
          <div>
            <label class="block font-bold text-gray-700 mb-1">Họ và tên người nhận</label>
            <input type="text" id="pay-name" placeholder="Nhập họ và tên của bạn" class="w-full border border-stone-300 p-3 rounded-xl outline-none focus:border-emerald-700 font-medium">
          </div>
          <div>
            <label class="block font-bold text-gray-700 mb-1">Số điện thoại liên hệ</label>
            <input type="tel" id="pay-phone" placeholder="Nhập số điện thoại nhận hàng" class="w-full border border-stone-300 p-3 rounded-xl outline-none focus:border-emerald-700 font-medium">
          </div>
          <div>
            <label class="block font-bold text-gray-700 mb-1">Địa chỉ giao hàng chi tiết</label>
            <input type="text" id="pay-address" placeholder="Số nhà, tên đường, phường/xã, quận/huyện..." class="w-full border border-stone-300 p-3 rounded-xl outline-none focus:border-emerald-700 font-medium">
          </div>
          <div>
            <label class="block font-bold text-gray-700 mb-1">Phương thức thanh toán</label>
            <select id="pay-method" onchange="togglePaymentMethod()" class="w-full border border-stone-300 p-3 rounded-xl outline-none font-bold bg-white">
              <option value="qr">Chuyển khoản VietQR (Quét mã)</option>
              <option value="cod">Thanh toán khi nhận hàng (COD)</option>
            </select>
          </div>
        </div>

        <!-- KHU VỰC HIỆN MÃ QR KHI CHỌN CHUYỂN KHOẢN -->
        <div id="qr-section" class="bg-stone-50 border border-stone-200 p-6 rounded-2xl text-center space-y-4">
          <p class="text-xs font-bold text-stone-700">Quét mã QR để chuyển khoản nhanh</p>
          <div class="w-48 h-48 bg-white p-3 rounded-2xl mx-auto shadow-md border flex items-center justify-center">
            <!-- VietQR tạo tự động động theo tổng tiền -->
            <img id="vietqr-img" src="" alt="VietQR" class="w-full h-full object-contain">
          </div>
          <p class="text-[11px] text-gray-500">Ngân hàng: <strong>MB Bank</strong> | STK: <strong>1900 FRESHDRINK</strong></p>
        </div>

        <button onclick="finishOrder()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-black py-4 rounded-xl shadow-lg transition uppercase tracking-wider text-xs">
          Hoàn Tất Đặt Hàng
        </button>
      </div>

      <!-- CỘT 2: TÓM TẮT ĐƠN HÀNG -->
      <div class="bg-white rounded-3xl p-8 shadow-sm border border-stone-200 space-y-6 h-fit">
        <h2 class="text-lg font-black uppercase text-stone-900 border-b pb-3">🛒 Đơn Hàng Của Bạn</h2>
        
        <div id="pay-items-list" class="divide-y max-h-64 overflow-y-auto pr-2 space-y-3">
          <!-- Danh sách sản phẩm trong đơn sẽ load ở đây -->
        </div>

        <div class="border-t pt-4 space-y-2 text-xs">
          <div class="flex justify-between text-gray-600">
            <span>Tạm tính:</span>
            <span id="pay-subtotal" class="font-bold">0 VNĐ</span>
          </div>
          <div class="flex justify-between text-emerald-700">
            <span>Giảm giá (Voucher):</span>
            <span id="pay-discount" class="font-bold">-0 VNĐ</span>
          </div>
          <div class="flex justify-between text-base font-black text-stone-900 border-t pt-3">
            <span>Tổng thanh toán:</span>
            <span id="pay-total" class="text-red-600">0 VNĐ</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // Kiểm tra đăng nhập trước khi vào trang thanh toán
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
      alert('Vui lòng đăng nhập để thanh toán đơn hàng!');
      window.location.href = 'login.html';
    }

    // Tự động điền thông tin nếu tài khoản có lưu
    if (currentUser.name && document.getElementById('pay-name')) {
      document.getElementById('pay-name').value = currentUser.name;
    }

    // Hiển thị tóm tắt đơn hàng từ giỏ hàng hiện tại hoặc pendingOrder
    function renderPaymentSummary() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart.length === 0) {
        alert('Giỏ hàng trống!');
        window.location.href = 'menu.html';
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const discountAmount = subtotal * discountRate;
      const total = subtotal - discountAmount;

      // Render danh sách sản phẩm
      const listEl = document.getElementById('pay-items-list');
      listEl.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between text-xs py-1">
          <div class="flex items-center gap-3">
            <img src="${item.image}" class="w-10 h-10 object-cover rounded-lg">
            <div>
              <p class="font-bold text-gray-800">${item.name} (${item.size})</p>
              <p class="text-gray-500">SL: ${item.quantity}</p>
            </div>
          </div>
          <span class="font-bold text-gray-900">${(item.price * item.quantity).toLocaleString('vi-VN')} VNĐ</span>
        </div>
      `).join('');

      document.getElementById('pay-subtotal').innerText = subtotal.toLocaleString('vi-VN') + ' VNĐ';
      document.getElementById('pay-discount').innerText = '-' + discountAmount.toLocaleString('vi-VN') + ' VNĐ';
      document.getElementById('pay-total').innerText = total.toLocaleString('vi-VN') + ' VNĐ';

      // Tạo mã VietQR tự động theo tổng tiền
      const qrImg = document.getElementById('vietqr-img');
      qrImg.src = `https://img.vietqr.io/image/MB-1900FRESHDRINK-compact.png?amount=${total}&addInfo=Thanh%20toan%20don%20hang%20FreshDrink`;
    }

    function togglePaymentMethod() {
      const method = document.getElementById('pay-method').value;
      const qrSection = document.getElementById('qr-section');
      if (method === 'cod') {
        qrSection.style.display = 'none';
      } else {
        qrSection.style.display = 'block';
      }
    }

    function finishOrder() {
      const name = document.getElementById('pay-name').value.trim();
      const phone = document.getElementById('pay-phone').value.trim();
      const address = document.getElementById('pay-address').value.trim();
      const paymentMethod = document.getElementById('pay-method').value;

      if (!name || !phone || !address) {
        alert('Vui lòng điền đầy đủ thông tin giao hàng!');
        return;
      }

      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const discountAmount = subtotal * discountRate;
      const total = subtotal - discountAmount;

      // Đóng gói đơn hàng gửi sang Admin với trạng thái ban đầu là 'Chờ duyệt'
      const newOrder = {
        customer: { name, phone, address },
        paymentMethod,
        items: cart,
        subtotal,
        discount: discountAmount,
        total,
        status: 'Chờ duyệt'
      };

      let adminOrders = JSON.parse(localStorage.getItem('adminOrders')) || [];
      adminOrders.push(newOrder);
      localStorage.setItem('adminOrders', JSON.stringify(adminOrders));

      // Xóa giỏ hàng sau khi đặt thành công
      localStorage.removeItem('cart');
      alert('Đặt hàng thành công! Đơn hàng của bạn đã được gửi đến quản trị viên.');
      window.location.href = 'index.html';
    }

    renderPaymentSummary();
  </script>
</body>
</html>

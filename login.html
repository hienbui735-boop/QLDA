<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - FreshDrink</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-gray-100">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-yellow-300 to-yellow-500 text-emerald-950 rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg">
        🥤
      </div>
      <h1 class="text-2xl font-black text-gray-900 uppercase">Đăng Nhập</h1>
      <p class="text-xs text-gray-400 mt-1">Chào mừng bạn quay trở lại với FreshDrink</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Email / Tài khoản</label>
        <input type="email" id="login-email" required placeholder="Nhập email của bạn" class="w-full border border-gray-200 p-3 rounded-xl text-xs outline-none focus:border-emerald-700">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Mật khẩu</label>
        <input type="password" id="login-password" required placeholder="Nhập mật khẩu" class="w-full border border-gray-200 p-3 rounded-xl text-xs outline-none focus:border-emerald-700">
      </div>
      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-black text-xs py-3.5 rounded-xl shadow-lg transition uppercase tracking-wider mt-2">
        Đăng Nhập
      </button>
    </form>

    <p class="text-center text-xs text-gray-500 mt-6">
      Chưa có tài khoản? <a href="register.html" class="text-emerald-700 font-bold hover:underline">Đăng ký ngay</a>
    </p>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();

      let users = JSON.parse(localStorage.getItem('users')) || [];

      // Tìm kiếm tài khoản trong danh sách
      const foundUser = users.find(u => u.email === email);

      if (!foundUser) {
        alert('Tài khoản email này chưa được đăng ký!');
        return;
      }

      // Kiểm tra mật khẩu
      if (foundUser.password !== password) {
        alert('Mật khẩu không chính xác! Vui lòng kiểm tra lại.');
        return;
      }

      // Đăng nhập thành công, lưu phiên đăng nhập và chuyển về trang chủ
      localStorage.setItem('currentUser', JSON.stringify(foundUser));
      alert('Đăng nhập thành công!');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
